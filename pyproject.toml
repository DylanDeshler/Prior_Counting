[project]
name = "counterpoint-datagen"
version = "0.1.0"
description = "Synthetic data generation for counterpoint-vlm (see data_generation_spec.md)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.4",
    "opencv-python-headless>=4.9",
    "pycocotools>=2.0.8",
    "scipy>=1.11",
    "datasets>=3.0",
    "huggingface-hub>=0.24",
    "pandas>=2.0",
    "requests>=2.31",
    "emoji>=2.12",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "gradio>=5.0",
    "nltk>=3.8",
    "imagehash>=4.3",
    "pyarrow>=15",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datagen"]
